# CI/CD Pipeline — Hardening Notes
# ──────────────────────────────────────────────────────────────────────
# Pre-commit hooks (husky + lint-staged) enforce Prettier formatting and
# ESLint --fix on every commit, preventing unformatted code from reaching CI.
# Vitest coverage uses all: true so every source file counts toward thresholds —
# new files without tests immediately and visibly lower coverage.
# ──────────────────────────────────────────────────────────────────────
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ─── Stage 1: Lint ───────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm exec -- prisma generate --schema=backend/prisma/schema.prisma

      - name: Run Prettier check
        run: npx prettier --check .

      - name: Run ESLint (backend)
        run: npm run lint
        working-directory: backend

      - name: Run ESLint (frontend)
        run: npm run lint
        working-directory: frontend

      - name: Run TypeScript type check (backend)
        run: npm run typecheck
        working-directory: backend

      - name: Run TypeScript type check (frontend)
        run: npm run typecheck
        working-directory: frontend

  # ─── Stage 2: Test ───────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: promos_test
          POSTGRES_USER: promos
          POSTGRES_PASSWORD: promos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://promos:promos@localhost:5432/promos_test?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm exec -- prisma generate --schema=backend/prisma/schema.prisma

      - name: Push Prisma schema to database
        run: npm exec -- prisma db push --schema=backend/prisma/schema.prisma --accept-data-loss

      - name: Run backend tests with coverage
        run: npm run test:coverage
        working-directory: backend

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

      - name: Run frontend tests with coverage
        run: npm run test:coverage
        working-directory: frontend

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ─── Stage 3: Build ──────────────────────────────────────────────
  build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Stage 4: Smoke Test ────────────────────────────────────────
  smoke_test:
    name: Smoke Test (Docker Compose)
    needs: build
    runs-on: ubuntu-latest
    env:
      HEALTH_URL: http://localhost:3001/health
      TIMEOUT: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The smoke test uses a disposable docker-compose DB (ephemeral, torn down
      # at the end of this job). POSTGRES_PASSWORD defaults to 'changeme' ONLY
      # for this throwaway test DB — safe because it is never exposed to the
      # internet or used for persistent data. If a real secret is configured in
      # GitHub Secrets it will be honored instead.
      - name: Resolve smoke-test secrets
        run: |
          POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
          if [ -n "$POSTGRES_PASSWORD" ]; then
            echo "Using POSTGRES_PASSWORD from GitHub Secrets"
          else
            echo "POSTGRES_PASSWORD not set in GitHub Secrets — using default 'changeme'"
            echo "This is safe: the smoke-test DB is disposable (docker compose down -v)"
            POSTGRES_PASSWORD="changeme"
          fi
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> "$GITHUB_ENV"

      - name: Create .env for smoke test
        run: |
          echo "DATABASE_URL=postgresql://promos:${POSTGRES_PASSWORD}@postgres:5432/promos?schema=public" > .env
          echo "NODE_ENV=test" >> .env
          echo "PORT=3001" >> .env
          echo "FRONTEND_URL=http://localhost:5173" >> .env
          echo "POSTGRES_DB=promos" >> .env
          echo "POSTGRES_USER=promos" >> .env
          echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> .env

      - name: Start docker-compose services
        run: docker compose up -d

      - name: Wait for backend health check
        run: |
          echo "Waiting for backend at ${{ env.HEALTH_URL }}..."
          START_TIME=$(date +%s)
          TIMEOUT=${{ env.TIMEOUT }}

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))

            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "ERROR: Health check timed out after ${TIMEOUT}s"
              docker compose logs backend
              docker compose ps
              exit 1
            fi

            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.HEALTH_URL }}" 2>/dev/null || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✓ Backend health check passed (${ELAPSED}s)"
              break
            fi

            echo "  Waiting... (${ELAPSED}s elapsed, status: $HTTP_STATUS)"
            sleep 2
          done

      - name: Verify health response body
        run: |
          echo "Verifying health response body..."
          HEALTH_BODY=$(curl -s "${{ env.HEALTH_URL }}")
          echo "Response: $HEALTH_BODY"

          if echo "$HEALTH_BODY" | grep -q '"status"'; then
            echo "✓ Health response body valid"
          else
            echo "ERROR: Health response body missing 'status' field"
            exit 1
          fi

      - name: Verify frontend accessibility
        run: |
          echo "Checking frontend accessibility..."
          FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173 2>/dev/null || echo "000")

          if [ "$FRONTEND_STATUS" = "200" ]; then
            echo "✓ Frontend accessible (status: $FRONTEND_STATUS)"
          else
            echo "WARNING: Frontend returned status $FRONTEND_STATUS"
          fi

      - name: Capture container logs (on failure)
        if: failure()
        run: |
          echo "=== Container Logs ==="
          docker compose logs --tail=50
          echo "=== Container Status ==="
          docker compose ps

      - name: Tear down docker-compose
        if: always()
        run: docker compose down -v --remove-orphans

      - name: Cleanup .env file
        if: always()
        run: rm -f .env
