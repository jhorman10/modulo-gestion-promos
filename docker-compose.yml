services:
  postgres:
    image: postgres:16-alpine
    container_name: promos-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-promos}
      POSTGRES_USER: ${POSTGRES_USER:-promos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U promos -d promos']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - promos-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: promos-backend
    environment:
      DATABASE_URL: postgresql://promos:${POSTGRES_PASSWORD:-changeme}@postgres:5432/promos?schema=public
      NODE_ENV: production
      PORT: '3001'
      FRONTEND_URL: http://localhost:5173
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3001/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - promos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: promos-frontend
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:80']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - promos-network

volumes:
  postgres_data:

networks:
  promos-network:
    driver: bridge
